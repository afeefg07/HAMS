<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HAMS - Export Data</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#EEF2F7;padding:40px;}
.box{max-width:600px;margin:0 auto;background:white;padding:30px;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.1);}
h1{color:#0F2A4A;margin-bottom:10px;font-size:22px;}
p{color:#5B6B7E;margin-bottom:20px;font-size:14px;}
textarea{width:100%;height:200px;padding:12px;border:1px solid #DCE3EC;border-radius:8px;font-family:monospace;font-size:12px;resize:vertical;}
button{margin-top:16px;width:100%;padding:14px;background:#0F2A4A;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;}
button:hover{background:#17456B;}
.status{margin-top:14px;text-align:center;font-weight:bold;color:#1E8E5A;display:none;}
.count{font-size:13px;color:#5B6B7E;margin-top:6px;}
</style>
</head>
<body>

<div class="box">

<h1>📤 Export Data (send to another phone)</h1>
<p>This collects everything on THIS device — Assets, Employees, Login History, Departments and Inspections. Click Copy, then open Import Data on the other device and paste it in.</p>

<textarea id="dataBox" readonly></textarea>

<div class="count" id="countInfo"></div>

<button onclick="copyData()">📋 Copy My Data</button>

<div class="status" id="status">✅ Copied! Now open Import Data on the other device.</div>

</div>

<script>

const data = {
    Assets: localStorage.getItem("Assets"),
    Employees: localStorage.getItem("Employees"),
    LoginHistory: localStorage.getItem("LoginHistory"),
    Departments: localStorage.getItem("Departments"),
    Inspections: localStorage.getItem("Inspections")
};

const jsonText = JSON.stringify(data);

document.getElementById("dataBox").value = jsonText;

const assetCount = data.Assets ? JSON.parse(data.Assets).length : 0;
const employeeCount = data.Employees ? JSON.parse(data.Employees).length : 0;
const inspectionCount = data.Inspections ? JSON.parse(data.Inspections).length : 0;

document.getElementById("countInfo").textContent =
    assetCount + " asset(s), " + employeeCount + " employee(s), " + inspectionCount + " inspection(s) found on this device.";

function copyData(){

    const box = document.getElementById("dataBox");
    box.select();
    box.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(jsonText).then(function(){
        document.getElementById("status").style.display = "block";
    }).catch(function(){
        document.execCommand("copy");
        document.getElementById("status").style.display = "block";
    });

}

</script>

<script>
function clearAllHAMSData(){
 if(!confirm("This will permanently clear Assets, inspections, duties, notifications, issues and audit history from this browser. Continue?"))return;
 ["Assets","Inspections","InspectionAssignments","HAMS_Duties","HAMS_Notifications","HAMS_Issues","HAMS_AuditLog","assetCount","AssetCount","totalAssets","TotalAssets","assetsCount","AssetsCount"].forEach(k=>localStorage.removeItem(k));
 alert("All HAMS operational data cleared.");
 location.reload();
}
</script><button onclick="clearAllHAMSData()" style="position:fixed;right:20px;bottom:20px;padding:12px 16px;border:0;border-radius:8px;background:#b42318;color:#fff;cursor:pointer">🗑 Clear All HAMS Data</button></body>
</html>
