<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMS - Fault Tracking</title><link rel="stylesheet" href="../css/dept_layout.css">
<style>.content-card{background:#fff;border:1px solid var(--color-line);border-radius:16px;padding:22px;margin-bottom:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--color-line);border-radius:8px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:22px;width:min(600px,100%)}.box input,.box select,.box textarea{width:100%;padding:10px;border:1px solid var(--color-line);border-radius:8px;margin:6px 0 12px}.actions{display:flex;gap:8px;justify-content:flex-end}</style></head>
<body><aside class="sidebar"><div class="sidebar-brand"><img class="logo-mark" src="../images/logo.svg"><span class="title">HAMS</span></div><div class="dept-chip">FAULT TRACKING</div><nav><button class="nav-item active">⚠️ Fault Tracking</button><button class="nav-item" onclick="location.href='asset_inspection.html'">🔍 Asset Inspection</button><button class="nav-item" onclick="location.href='asset_360.html'">◉ Asset 360°</button><button class="nav-item" onclick="location.href='reports.html'">📊 Reports</button><button class="nav-item" onclick="location.href='audit_history.html'">🧾 Audit History</button></nav><div class="sidebar-footer"><button class="nav-item" onclick="location.href='department_dashboard.html'">⌂ Department Home</button><button class="nav-item" onclick="logout()">↪ Logout</button></div></aside>
<main class="main"><div class="topbar"><div><h1>Fault / Issue Tracking</h1><p>Track faults from discovery through repair and re-inspection.</p></div><button class="btn btn-primary" onclick="openNew()">+ Report Issue</button></div>
<div class="content-card"><div class="toolbar"><input id="q" placeholder="Search asset or issue"><select id="status"><option value="">All Status</option><option>Open</option><option>Under Repair</option><option>Resolved - Awaiting Re-inspection</option><option>Closed</option></select></div></div>
<div class="content-card"><div class="table-wrap"><table class="styled-table"><thead><tr><th>Asset</th><th>Issue</th><th>Reported</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<div class="modal" id="modal"><div class="box"><h3 id="mt">Report Issue</h3><label>Asset</label><select id="asset"></select><label>Issue title</label><input id="title" placeholder="e.g. Power cable damaged"><label>Description</label><textarea id="desc" placeholder="Describe the fault..."></textarea><label>Status</label><select id="st"><option>Open</option><option>Under Repair</option><option>Resolved - Awaiting Re-inspection</option><option>Closed</option></select><label>Repair / resolution notes</label><textarea id="resolution"></textarea><div class="actions"><button class="btn btn-secondary" onclick="closeM()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div></div></div>
<script src="../js/auth.js"></script><script src="../js/hams_core.js"></script><script>
let edit=null;function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fillAssets(){asset.innerHTML=hamsGetAssets().map(a=>`<option value="${esc(a.assetID)}">${esc(a.assetID)} — ${esc(a.assetName)}</option>`).join("")}
function render(){const q=document.getElementById("q").value.toLowerCase(),f=status.value,arr=hamsGetIssues().filter(x=>(!q||(x.assetID+" "+x.title+" "+x.description).toLowerCase().includes(q))&&(!f||x.status===f));rows.innerHTML=arr.length?arr.map(x=>`<tr><td><b>${esc(x.assetID)}</b><br>${esc(x.assetName)}</td><td>${esc(x.title)}<br><small>${esc(x.description)}</small></td><td>${new Date(x.createdAt).toLocaleString()}<br>${esc(x.reportedBy)}</td><td>${esc(x.status)}</td><td><button class="btn btn-secondary" style="padding:7px 10px" onclick="editIssue('${esc(x.issueID)}')">Update</button><button class="btn btn-secondary" style="padding:7px 10px;margin-left:5px" onclick="hamsOpenAsset360('${esc(x.assetID)}')">Asset 360°</button></td></tr>`).join(""):'<tr><td colspan="5">No issues found.</td></tr>'}
function openNew(){edit=null;fillAssets();title.value="";desc.value="";st.value="Open";resolution.value="";modal.classList.add("open")}
function editIssue(id){const x=hamsGetIssues().find(i=>i.issueID===id);if(!x)return;edit=id;fillAssets();asset.value=x.assetID;title.value=x.title;desc.value=x.description;st.value=x.status;resolution.value=x.resolution||"";modal.classList.add("open")}
function save(){const a=hamsAsset(asset.value);if(!a||!title.value.trim())return alert("Select an asset and enter an issue title.");let arr=hamsGetIssues();let x=edit?arr.find(i=>i.issueID===edit):null;if(!x){x={issueID:"ISS-"+Date.now(),createdAt:new Date().toISOString(),reportedBy:localStorage.getItem("Employee")||"Unknown"};arr.unshift(x)}Object.assign(x,{assetID:a.assetID,assetName:a.assetName,title:title.value.trim(),description:desc.value.trim(),status:st.value,resolution:resolution.value.trim(),updatedAt:new Date().toISOString()});hamsSaveIssues(arr);hamsAudit(edit?"Updated Issue":"Reported Issue","Issue",x.issueID,x.title);closeM();render()}
function closeM(){modal.classList.remove("open")}q.addEventListener("input",render);status.addEventListener("change",render);fillAssets();render();
</script></body></html>
