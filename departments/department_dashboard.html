<script>

const dept = localStorage.getItem("CurrentDepartment");

const employee = localStorage.getItem("Employee");

const currentDept = getDepartment(dept);

document.getElementById("departmentName").textContent = currentDept.name + " Dashboard";
document.getElementById("employeeName").textContent = employee || "Employee";
document.getElementById("deptChip").textContent = currentDept.code + " · " + currentDept.name;

// -----------------------------
// Real Stats (from actual Assets data, no placeholder numbers)
// -----------------------------
function loadStats(){

    const allAssets = JSON.parse(localStorage.getItem("Assets") || "[]");

    const deptAssets = allAssets.filter(a => a.departmentKey === dept || a.workDepartment === currentDept.code);

    const total = deptAssets.length;
    const working = deptAssets.filter(a => a.status === "Working").length;
    const repair = deptAssets.filter(a => a.status === "Under Repair").length;
    const condemned = deptAssets.filter(a => a.status === "Condemned").length;

    document.getElementById("statTotal").textContent = total;
    document.getElementById("statWorking").textContent = working;
    document.getElementById("statRepair").textContent = repair;
    document.getElementById("statCondemned").textContent = condemned;

}

loadStats();
renderNotificationBadge("dashNotifBadge");

// -----------------------------
// Search -> hands off to Asset Tracking with the keyword pre-filled
// -----------------------------
document.getElementById("searchInput").addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        const keyword = this.value.trim();

        if(keyword){
            localStorage.setItem("PendingSearch", keyword);
        }

        window.location.href = "asset_tracking.html";

    }

});

// -----------------------------
// Placeholder for not-yet-built features
// -----------------------------
function comingSoon(){
    alert("This feature isn't built yet. It's on the roadmap!");
}

</script>
