<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMS - Verify Asset</title>

<link rel="stylesheet" href="../css/dept_layout.css">

</head>

<body>

<aside class="sidebar">

<div class="sidebar-brand">
<img class="logo-mark" src="../images/logo.svg" alt="HAMS Logo">
<span class="title">HAMS</span>
</div>

<div class="dept-chip" id="deptChip"></div>

<nav>

<button class="nav-item" onclick="location.href='asset_registration.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
Asset Registration
</button>

<button class="nav-item" onclick="location.href='asset_tracking.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
Asset Tracking
</button>

<button class="nav-item" onclick="location.href='asset_inspection.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
Asset Inspection
</button>

<button class="nav-item active" onclick="location.href='asset_verify.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M14 20h3M20 14v3M20 20v.01"/></svg>

<button class="nav-item" onclick="location.href='location_inspection.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="11" r="2.4"/></svg>
Location Inspection
</button>

<button class="nav-item" onclick="location.href='asset_utilization.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
Asset Utilization

</nav>

<div class="sidebar-footer">

<button class="nav-item" onclick="location.href='department_dashboard.html'">

Department Home

<button class="nav-item" onclick="logout()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
Logout
</button>

</div>

</aside>

<main class="main">

<h1 class="page-title">Verify Asset</h1>

<div class="content-card">

<p class="hint">Step 1: Physically check each asset is present, then click "Verify". Once verified, it becomes eligible for Asset Inspection.</p>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;">

<div style="background:var(--color-bg);border-radius:10px;padding:14px 16px;">
<div style="font-size:12px;color:var(--color-muted);margin-bottom:4px;">Verified</div>
<div style="font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--status-working);" id="statVerified">0</div>
</div>

<div style="background:var(--color-bg);border-radius:10px;padding:14px 16px;">
<div style="font-size:12px;color:var(--color-muted);margin-bottom:4px;">Unverified</div>
<div style="font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--status-condemned);" id="statUnverified">0</div>
</div>

</div>

</div>

<div class="content-card">

<h3>Filter by Location</h3>

<div class="form-grid" style="margin-bottom:0;">

<div>
<label>Block</label>
<select id="block">
<option value="">All Blocks</option>
<option value="Main Block">Main Block</option>
<option value="Emergency Block">Emergency Block</option>
<option value="Service Block">Service Block</option>
<option value="Yard">Yard</option>
</select>
</div>

<div>
<label>Section</label>
<select id="section">
<option value="">All Sections</option>
</select>
</div>

<div>
<label>Location</label>
<select id="location">
<option value="">All Locations</option>
</select>
</div>

<div>
<label>Sub Location</label>
<select id="subLocation">
<option value="">All Sub Locations</option>
</select>
</div>

</div>

<div style="margin-top:16px;">
<button class="btn btn-secondary" onclick="clearFilters()">📋 Clear Filter</button>
</div>

</div>

<div class="content-card">

<div class="table-wrap">

<table class="styled-table">

<thead>
<tr>
<th>Asset ID</th>
<th>Asset Name</th>
<th id="deptColHeader" style="display:none;">Department</th>
<th>Status</th>
<th>Details</th>
<th>Action</th>
</tr>
</thead>

<tbody id="verifyTable">
</tbody>

</table>

</div>

</div>

</main>

<!-- ===========================
Asset Detail Modal
=========================== -->

<div class="modal-overlay" id="detailModal">

<div class="modal-box" style="width:440px;max-height:85vh;overflow-y:auto;">

<h3 id="detailModalTitle">Asset Details</h3>

<div class="photo-preview" style="margin-top:14px;">
<img id="detailModalPhoto" src="../images/no-image.png" style="width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--color-line);">
</div>

<div id="detailFields" style="margin-top:10px;"></div>

<h3 style="margin-top:20px;font-size:15px;">Inspection History</h3>

<div id="detailHistory" style="margin-top:6px;"></div>

<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeDetailModal()" style="flex:1;">Close</button>
</div>

</div>

</div>

<script src="../js/hospital_locations.js"></script>
<script src="../js/department_store.js"></script>
<script src="../js/asset_verify.js"></script>

<script>

if(isGlobalScope){
    document.getElementById("deptChip").textContent = "ALL DEPARTMENTS";
    document.getElementById("deptColHeader").style.display = "";
} else {
    document.getElementById("deptChip").textContent =
        currentDept.code + " · " + currentDept.name;
}

function comingSoon(){
    alert("This feature isn't built yet. It's on the roadmap!");
}

function logout(){

    if(confirm("Are you sure you want to logout?")){

        localStorage.removeItem("Employee");
        localStorage.removeItem("Username");
        localStorage.removeItem("EmployeeID");
        localStorage.removeItem("Department");
        localStorage.removeItem("Role");

        window.location.href = "../index.html";

    }

}

</script>

</body>

</html>
