<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HAMS - Reverse Asset Inspection</title><link rel="stylesheet" href="../css/dept_layout.css"><style>.card{background:#fff;border:1px solid var(--color-line);border-radius:16px;padding:22px;margin-bottom:20px}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:20px}.modal-overlay.open{display:flex}.modal{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:24px}.modal label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}.modal input,.modal select,.modal textarea{width:100%;padding:10px;border:1px solid var(--color-line);border-radius:8px}.modal textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}</style></head><body>
<aside class="sidebar"><div class="sidebar-brand"><img class="logo-mark" src="../images/logo.svg"><span class="title">HAMS</span></div><div class="dept-chip">ASSET INSPECTION</div><nav><button class="nav-item" onclick="location.href='asset_inspection.html'">🔍 Asset Inspection</button><button class="nav-item active" onclick="location.href='reverse_asset_inspection.html'">↩️ Reverse Asset Inspection</button><button class="nav-item" onclick="location.href='assign_duty.html?scope=all'">📋 Assign Duty</button><button class="nav-item" onclick="location.href='my_duties.html'">✓ My Duties</button><button class="nav-item" onclick="location.href='notifications.html'">🔔 Notifications</button></nav><div class="sidebar-footer"><button class="nav-item" onclick="location.href='../dashboard.html'">⌂ Main Dashboard</button><button class="nav-item" onclick="logout()">↪ Logout</button></div></aside>
<main class="main"><div class="topbar"><div><h1>Reverse Asset Inspection</h1><p>Re-open an asset for inspection when a previous inspection needs to be checked again.</p></div><button class="btn btn-secondary" onclick="location.href='asset_inspection.html'">← Asset Inspection</button></div><div class="card"><div class="table-wrap"><table class="styled-table"><thead><tr><th>Asset ID</th><th>Asset</th><th>Last Inspection</th><th>Result</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<div class="modal-overlay" id="modal"><div class="modal"><h3>Reverse Asset Inspection</h3><p id="sub" style="color:var(--color-muted);font-size:13px"></p><label>Reason for Reverse Inspection</label><textarea id="reason" placeholder="Why does this asset need to be inspected again?"></textarea><label>Inspection Result</label><select id="result"><option>Pass</option><option>Needs Attention</option><option>Fail</option><option>Asset Not Found</option></select><label>Findings / Remarks</label><textarea id="notes" placeholder="Enter the new inspection findings..."></textarea><div class="actions"><button class="btn btn-secondary" onclick="closeM()">Cancel</button><button class="btn btn-primary" onclick="save()">✓ Save Reverse Inspection</button></div></div></div>
<script src="../js/auth.js"></script>
<script src="../js/hams_data_counts.js"></script><script src="../js/department_store.js"></script><script>
const assets=()=>JSON.parse(localStorage.getItem("Assets") || "[]");const ins=()=>JSON.parse(localStorage.getItem('Inspections'))||[];let selected='';
function esc(v){return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function latest(id){return ins().filter(x=>x.assetID===id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
function load(){let r=document.getElementById('rows');r.innerHTML='';assets().forEach(a=>{let x=latest(a.assetID);r.innerHTML+=`<tr><td><b>${esc(a.assetID)}</b></td><td>${esc(a.assetName)}</td><td>${x?new Date(x.date).toLocaleString():'—'}</td><td>${x?esc(x.condition):'Never Inspected'}</td><td><button class="btn btn-primary" style="padding:8px 12px;font-size:12px" onclick="openM('${esc(a.assetID)}')">↩️ Reverse Inspection</button></td></tr>`});if(!r.innerHTML)r.innerHTML='<tr><td colspan="5">No assets found.</td></tr>'}
function openM(id){let a=assets().find(x=>x.assetID===id);if(!a)return;selected=id;let x=latest(id);document.getElementById('sub').textContent=a.assetName+' ('+a.assetID+') · Previous result: '+(x?.condition||'Never Inspected');document.getElementById('reason').value='';document.getElementById('notes').value='';document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open');selected=''}
function save(){let a=assets().find(x=>x.assetID===selected);if(!a)return;let list=ins(),prev=latest(selected);list.push({inspectionID:'REV-'+Date.now(),assetID:selected,date:new Date().toISOString(),inspectedBy:localStorage.getItem('Employee')||'Unknown',departmentKey:localStorage.getItem('CurrentDepartment')||a.departmentKey||'',inspectionType:'Reverse Asset Inspection',previousInspectionID:prev?.inspectionID||'',condition:document.getElementById('result').value,notes:'Reason: '+document.getElementById('reason').value.trim()+' | '+document.getElementById('notes').value.trim()});localStorage.setItem('Inspections',JSON.stringify(list));closeM();load();alert('Reverse Asset Inspection saved successfully.')}
load();const q=new URLSearchParams(location.search).get('assetID');if(q)setTimeout(()=>openM(q),100);
</script></body></html>
