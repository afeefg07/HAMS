<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMS - Audit History</title><link rel="stylesheet" href="../css/dept_layout.css"></head>
<body><aside class="sidebar"><div class="sidebar-brand"><img class="logo-mark" src="../images/logo.svg"><span class="title">HAMS</span></div><div class="dept-chip">AUDIT HISTORY</div><nav><button class="nav-item active">🧾 Audit History</button><button class="nav-item" onclick="location.href='asset_inspection.html'">🔍 Asset Inspection</button><button class="nav-item" onclick="location.href='fault_tracking.html'">⚠️ Fault Tracking</button><button class="nav-item" onclick="location.href='reports.html'">📊 Reports</button></nav><div class="sidebar-footer"><button class="nav-item" onclick="location.href='department_dashboard.html'">⌂ Department Home</button><button class="nav-item" onclick="logout()">↪ Logout</button></div></aside>
<main class="main"><div class="topbar"><div><h1>Audit History</h1><p>Who did what, when, and to which asset.</p></div><button class="btn btn-secondary" onclick="window.print()">🖨 Print</button></div><div class="content-card"><input id="q" placeholder="Search user, action, asset ID..." style="width:100%;padding:11px;border:1px solid var(--color-line);border-radius:8px"></div><div class="content-card"><div class="table-wrap"><table class="styled-table"><thead><tr><th>Date / Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script src="../js/auth.js"></script><script src="../js/hams_core.js"></script><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){const q=document.getElementById("q").value.toLowerCase(),a=JSON.parse(localStorage.getItem("HAMS_AuditLog")||"[]").filter(x=>!q||(x.user+" "+x.action+" "+x.entityID+" "+x.details).toLowerCase().includes(q));rows.innerHTML=a.length?a.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString()}</td><td>${esc(x.user)}<br><small>${esc(x.employeeID)} · ${esc(x.role)}</small></td><td>${esc(x.action)}</td><td>${esc(x.entityType)}<br>${esc(x.entityID)}</td><td>${esc(x.details)}</td></tr>`).join(""):'<tr><td colspan="5">No audit entries.</td></tr>'}q.addEventListener("input",render);render();
</script></body></html>
