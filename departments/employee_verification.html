<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Department Access</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#eef4ff;

}

.box{

width:420px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

h1{

text-align:center;
color:#003366;
margin-bottom:10px;

}

#department{

text-align:center;
font-size:18px;
font-weight:bold;
color:#0b5ed7;
margin-bottom:25px;

}

label{

font-weight:bold;

}

input{

width:100%;
padding:14px;
margin-top:8px;
margin-bottom:15px;
font-size:18px;
border:1px solid #ccc;
border-radius:8px;
text-align:center;
letter-spacing:5px;

}

.show{

display:flex;
align-items:center;
gap:8px;
margin-bottom:20px;

}

.show input{

width:auto;
margin:0;

}

button{

width:100%;
padding:14px;
background:#003366;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#0055aa;

}

</style>

</head>

<body>

<div class="box">

<h1>🔒 Department Access</h1>

<div id="department"></div>

<label>Department PIN</label>

<input
type="password"
id="pin"
maxlength="4"
placeholder="Enter 4 Digit PIN">

<div class="show">

<input
type="checkbox"
onclick="togglePin()">

Show PIN

</div>

<button onclick="verify()">

CONTINUE

</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const dept = params.get("dept");

const departmentNames={

biomedical:"Biomedical Engineering",

it:"Information Technology",

fire:"Fire & Safety",

facilities:"Facilities Management",

engineering:"Engineering Support",

food:"Food & Beverage"

};

document.getElementById("department").innerHTML=
departmentNames[dept];

const departmentPins={

biomedical:"5600",

it:"5601",

fire:"5602",

facilities:"5603",

engineering:"5604",

food:"5605"

};

function togglePin(){

let pin=document.getElementById("pin");

pin.type=pin.type==="password"?"text":"password";

}

function verify(){

let enteredPin=document.getElementById("pin").value.trim();

if(enteredPin===""){

alert("Enter Department PIN");

return;

}

if(enteredPin!==departmentPins[dept]){

alert("Invalid Department PIN");

return;

}

localStorage.setItem("CurrentDepartment",dept);

window.location.href="department_dashboard.html";

}

</script>

</body>

</html>
