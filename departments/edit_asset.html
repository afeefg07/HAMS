<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
Logout
</button>

</div>

</aside>

<main class="main">

<h1 class="page-title">Edit Asset</h1>

<form id="editForm">

<div class="content-card">

<div class="photo-preview">
<img id="previewImage" src="../images/no-image.png">
</div>

<div class="form-grid">

<div>
<label>Asset ID</label>
<input type="text" id="assetID" readonly>
</div>

<div>
<label>Asset Name *</label>
<input type="text" id="assetName">
</div>

<div>
<label>Manufacturer</label>
<input type="text" id="manufacturer">
</div>

<div>
<label>Model</label>
<input type="text" id="model">
</div>

<div>
<label>Serial Number</label>
<input type="text" id="serial">
</div>

<div>
<label>Category</label>
<input type="text" id="category">
</div>

<div>
<label>Sub Category</label>
<input type="text" id="subcategory">
</div>

<div>
<label>Block</label>
<input type="text" id="block">
</div>

<div>
<label>Section</label>
<input type="text" id="section">
</div>

<div>
<label>Location</label>
<input type="text" id="location">
</div>

<div>
<label>Sub Location</label>
<input type="text" id="subLocation">
</div>

<div>
<label>Asset Type</label>
<input type="text" id="assetType">
</div>

<div>
<label>Custodian</label>
<input type="text" id="custodian">
</div>

<div>
<label>Used By</label>
<input type="text" id="usedBy">
</div>

<div>
<label>Status</label>
<input type="text" id="status">
</div>

</div>

</div>

<div style="display:flex;gap:14px;margin-bottom:40px;">

<button type="submit" class="btn btn-primary">💾 Save Changes</button>

<button type="button" class="btn btn-secondary" onclick="location.href='asset_tracking.html'">Cancel</button>

</div>

</form>

</main>

<script src="../js/department_store.js"></script>
<script src="../js/dept_edit_asset.js"></script>

<script>

document.getElementById("deptChip").textContent =
    currentDept.code + " · " + currentDept.name;

function comingSoon(){
    alert("This feature isn't built yet. It's on the roadmap!");
}

function logout(){

    if(confirm("Are you sure you want to logout?")){

        localStorage.removeItem("Employee");
        localStorage.removeItem("Username");
        localStorage.removeItem("EmployeeID");
        localStorage.removeItem("Department");
        localStorage.removeItem("Role");

        window.location.href = "../index.html";

    }

}

</script>

</body>

</html>
