<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMS - Reports</title><link rel="stylesheet" href="../css/dept_layout.css"><style>.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--color-line);border-radius:14px;padding:18px}.num{font-size:28px;font-weight:800;margin-top:8px}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head>
<body><aside class="sidebar"><div class="sidebar-brand"><img class="logo-mark" src="../images/logo.svg"><span class="title">HAMS</span></div><div class="dept-chip">REPORTS</div><nav><button class="nav-item active">📊 Reports</button><button class="nav-item" onclick="location.href='asset_360.html'">◉ Asset 360°</button><button class="nav-item" onclick="location.href='fault_tracking.html'">⚠️ Fault Tracking</button><button class="nav-item" onclick="location.href='audit_history.html'">🧾 Audit History</button></nav><div class="sidebar-footer"><button class="nav-item" onclick="location.href='department_dashboard.html'">⌂ Department Home</button><button class="nav-item" onclick="logout()">↪ Logout</button></div></aside>
<main class="main"><div class="topbar"><div><h1>HAMS Reports</h1><p>Live operational overview and exportable records.</p></div><button class="btn btn-secondary" onclick="window.print()">🖨 Print</button></div>
<div class="cards"><div class="card">Total Assets<div class="num" id="assets">0</div></div><div class="card">Verified<div class="num" id="verified">0</div></div><div class="card">Inspected<div class="num" id="inspected">0</div></div><div class="card">Open Issues<div class="num" id="issues">0</div></div><div class="card">Pending Duties<div class="num" id="duties">0</div></div></div>
<div class="content-card"><h3>Export</h3><div class="actions"><button class="btn btn-primary" onclick="csvAssets()">📥 Assets CSV</button><button class="btn btn-primary" onclick="csvInspections()">📥 Inspections CSV</button><button class="btn btn-primary" onclick="csvIssues()">📥 Issues CSV</button><button class="btn btn-primary" onclick="csvAudit()">📥 Audit CSV</button></div></div>
<div class="content-card"><h3>Inspection Result Summary</h3><div id="summary"></div></div></main>
<script src="../js/auth.js"></script><script src="../js/hams_core.js"></script><script>
function csv(name,rows){if(!rows.length)return alert("No data to export.");const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];const out=[keys.join(","),...rows.map(r=>keys.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(","))].join("\\n");const b=new Blob([out],{type:"text/csv"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function csvAssets(){csv("HAMS_Assets.csv",hamsGetAssets())}function csvInspections(){csv("HAMS_Inspections.csv",hamsGetInspections())}function csvIssues(){csv("HAMS_Issues.csv",hamsGetIssues())}function csvAudit(){csv("HAMS_Audit_History.csv",JSON.parse(localStorage.getItem("HAMS_AuditLog")||"[]"))}
function render(){const a=hamsGetAssets(),i=hamsGetInspections(),ids=new Set(a.map(x=>x.assetID));assets.textContent=a.length;verified.textContent=a.filter(x=>x.verified===true).length;inspected.textContent=i.filter(x=>ids.has(x.assetID)).length;issues.textContent=hamsIssueCount();duties.textContent=hamsGetDuties().filter(x=>x.status!=="Completed").length;const c={Pass:0,"Needs Attention":0,Fail:0,"Asset Not Found":0};i.filter(x=>ids.has(x.assetID)).forEach(x=>{if(c[x.condition]!=null)c[x.condition]++});summary.innerHTML=Object.entries(c).map(x=>`<div style="padding:10px;border-bottom:1px solid var(--color-line)"><b>${x[0]}</b><span style="float:right">${x[1]}</span></div>`).join("")}render();
</script></body></html>
