<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMS - Asset Management</title>

<link rel="stylesheet" href="../css/admin_dashboard.css">
<link rel="stylesheet" href="../css/components.css">

</head>

<body>

<header>

<div class="brand">

<img class="logo-mark" src="../images/logo.svg" alt="HAMS Logo">

<h1>Asset Management</h1>

</div>

<div class="right">

<button onclick="location.href='admin_dashboard.html'">⬅ Back</button>

</div>

</header>

<div class="container">

<div class="content-card">

<div style="display:flex;gap:12px;flex-wrap:wrap;">

<input
type="text"
id="search"
placeholder="Search Asset ID, Asset Name or Serial Number"
style="flex:1;min-width:240px;padding:11px 14px;border:1px solid var(--color-line);border-radius:9px;font-family:inherit;font-size:14px;">

<button class="btn btn-primary" onclick="loadAssets()">🔍 Search</button>

</div>

</div>

<div class="content-card">

<div class="table-wrap">

<table class="styled-table">

<thead>

<tr>
<th>Photo</th>
<th>Asset ID</th>
<th>Asset Name</th>
<th>Manufacturer</th>
<th>Department</th>
<th>Location</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="assetTable">

</tbody>

</table>

</div>

</div>

</div>

<script src="../js/department_store.js"></script>

<script>

// ========================================
// Protect Admin Pages
// ========================================

if(localStorage.getItem("AdminLoggedIn") !== "true"){
    alert("Access Denied!");
    window.location.href = "admin_login.html";
}

function statusBadge(status){

    let cls = "badge-working";

    if(status === "Under Repair"){
        cls = "badge-repair";
    } else if(status === "Condemned"){
        cls = "badge-condemned";
    }

    return `<span class="badge ${cls}">${status || "Working"}</span>`;

}

function loadAssets(){

    let keyword = document.getElementById("search").value.toLowerCase();

    let assets = JSON.parse(localStorage.getItem("Assets") || "[]");

    let table = document.getElementById("assetTable");

    table.innerHTML = "";

    let found = false;

    assets.forEach((asset,index)=>{

        if(

            (asset.assetID || "").toLowerCase().includes(keyword) ||

            (asset.assetName || "").toLowerCase().includes(keyword) ||

            (asset.serial || "").toLowerCase().includes(keyword)

        ){

            found = true;

            const deptName = getDepartment(asset.departmentKey).name;

            table.innerHTML += `

            <tr>

                <td>

                    <img class="thumb" src="${asset.photo || '../images/no-image.png'}">

                </td>

                <td>${asset.assetID}</td>

                <td>${asset.assetName}</td>

                <td>${asset.manufacturer || "—"}</td>

                <td>${deptName}</td>

                <td>${asset.location || ""} ${asset.subLocation || ""}</td>

                <td>${statusBadge(asset.status)}</td>

                <td>

                    <div class="table-actions">

                        <button class="btn-icon" onclick="viewAsset(${index})" title="View">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>

                        <button class="btn-icon" onclick="asset360(${index})" title="Asset 360">◉</button>
                        <button class="btn-icon" onclick="editAsset(${index})" title="Edit">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
                        </button>

                        <button class="btn-icon danger" onclick="deleteAsset(${index})" title="Delete">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
                        </button>

                    </div>

                </td>

            </tr>

            `;

        }

    });

    if(!found){

        table.innerHTML = `
        <tr class="empty-row">
            <td colspan="8">
                No Assets Found
            </td>
        </tr>
        `;

    }

}

function viewAsset(index){

    localStorage.setItem("SelectedAsset", index);

    window.location.href = "asset_details.html";

}

function asset360(index){localStorage.setItem("SelectedAsset",index);const a=JSON.parse(localStorage.getItem("Assets")||"[]")[index];if(a)location.href="../departments/asset_360.html?assetID="+encodeURIComponent(a.assetID);}
function editAsset(index){

    localStorage.setItem("SelectedAsset", index);

    window.location.href = "edit_asset.html";

}

function deleteAsset(index){

    if(confirm("Are you sure you want to delete this asset?")){

        let assets = JSON.parse(localStorage.getItem("Assets") || "[]");

        assets.splice(index,1);

        localStorage.setItem("Assets", JSON.stringify(assets));

        loadAssets();

    }

}

loadAssets();

</script>

</body>

</html>
