<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMS - Admin Dashboard</title>

<link rel="stylesheet" href="../css/admin_dashboard.css">

</head>

<body>

<header>

<div class="brand">

<img class="logo-mark" src="../images/logo.svg" alt="HAMS Logo">

<h1>Hospital Admin Dashboard</h1>

</div>

<div class="right">

<span id="adminName">Administrator</span>

<button onclick="logout()">Logout</button>

</div>

</header>

<div class="container">

<div class="stats-strip" id="statsStrip">

<div class="stat-pill">
<div class="stat-label">Total Assets</div>
<div class="stat-value" id="statAssets">0</div>
</div>

<div class="stat-pill">
<div class="stat-label">Total Employees</div>
<div class="stat-value" id="statEmployees">0</div>
</div>

<div class="stat-pill">
<div class="stat-label">Departments</div>
<div class="stat-value" id="statDepartments">0</div>
</div>

</div>

<div class="page-heading">
<h2>Management</h2>
</div>

<div class="cards">

<button class="card" onclick="location.href='asset_management.html'">
<span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
<div class="card-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
</div>
<h2>Asset Management</h2>
<p>View, edit and delete all hospital assets.</p>
</button>

<button class="card" onclick="location.href='employee_management.html'">
<span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
<div class="card-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 20a5.5 5.5 0 016.5-5.4"/></svg>
</div>
<h2>Employee Management</h2>
<p>Manage hospital employee accounts.</p>
</button>

<button class="card" onclick="location.href='department_management.html'">
<span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
<div class="card-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9.5l8-5 8 5V21"/><path d="M9.5 21v-6h5v6"/></svg>
</div>
<h2>Department Management</h2>
<p>Add, edit or remove departments.</p>
</button>

<button class="card" onclick="location.href='login_history.html'">
<span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
<div class="card-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
</div>
<h2>Login History</h2>
<p>View employee login records.</p>
</button>

<button class="card" onclick="comingSoon()">
<span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
<span class="soon-tag">SOON</span>
<div class="card-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
</div>
<h2>Reports</h2>
<p>View system-wide asset reports.</p>
</button>

<button class="card" onclick="comingSoon()">
<span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
<span class="soon-tag">SOON</span>
<div class="card-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.6M12 18.9v2.6M4.7 4.7l1.8 1.8M17.5 17.5l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.7 19.3l1.8-1.8M17.5 6.5l1.8-1.8"/></svg>
</div>
<h2>System Settings</h2>
<p>Configure application settings.</p>
</button>

<button class="card danger" onclick="resetDatabase()">
<span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
<div class="card-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
</div>
<h2>Reset Test Data</h2>
<p>Delete all assets and restart Asset IDs. This cannot be undone.</p>
</button>

</div>

</div>

<script src="../js/department_store.js"></script>

<script>

// ========================================
// Protect Admin Dashboard
// ========================================

if(localStorage.getItem("AdminLoggedIn")!=="true"){

    alert("Access Denied!");

    window.location.href="admin_login.html";

}

// ========================================
// Display Admin Name
// ========================================

document.getElementById("adminName").innerHTML="Administrator";

// ========================================
// Live Stats
// ========================================

function loadStats(){

    const assets = JSON.parse(localStorage.getItem("Assets") || "[]");
    const employees = JSON.parse(localStorage.getItem("Employees")) || [];
    const departments = getDepartments();

    document.getElementById("statAssets").textContent = assets.length;
    document.getElementById("statEmployees").textContent = employees.length;
    document.getElementById("statDepartments").textContent = departments.length;

}

loadStats();

// ========================================
// Logout
// ========================================

function logout(){

    if(confirm("Logout from Admin Panel?")){

        localStorage.removeItem("AdminLoggedIn");

        window.location.href="admin_login.html";

    }

}

// ========================================
// Reset Database
// ========================================

function resetDatabase(){

    if(confirm("Delete all assets and reset Asset IDs?")){

        localStorage.removeItem("Assets");
        localStorage.removeItem("LastAssetNumber");

        alert("Database Reset Successfully.");

        loadStats();

    }

}

// ========================================
// Placeholder for not-yet-built features
// ========================================

function comingSoon(){
    alert("This feature isn't built yet. It's on the roadmap!");
}

</script>

<script>document.addEventListener("DOMContentLoaded",()=>{const b=document.createElement("button");b.textContent="🔐 Access Control";b.onclick=()=>location.href="access_control.html";b.style.cssText="position:fixed;right:24px;bottom:24px;padding:11px 16px;border:0;border-radius:9px;background:#12385c;color:#fff;cursor:pointer";document.body.appendChild(b)});</script></body>

</html>
