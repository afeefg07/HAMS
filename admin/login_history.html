<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Login History</title>

<style>

body{
font-family:Arial;
background:#eef3f8;
margin:30px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

table{

width:100%;
border-collapse:collapse;
background:white;

}

th{

background:#003366;
color:white;
padding:12px;

}

td{

padding:12px;
border-bottom:1px solid #ddd;
text-align:center;

}

h1{

margin-bottom:0;

}

.clearAllBtn{

background:#d32f2f;
color:white;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-size:15px;

}

.clearAllBtn:hover{

background:#b71c1c;

}

.deleteBtn{

background:white;
border:1px solid #bbb;
border-radius:6px;
width:38px;
height:38px;
font-size:16px;
cursor:pointer;
transition:.2s;

}

.deleteBtn:hover{

background:#d32f2f;
color:white;
border-color:#d32f2f;

}

</style>

</head>

<body>

<div class="top-bar">

<h1>Login History</h1>

<button class="clearAllBtn" onclick="clearAllHistory()">🗑 Clear All</button>

</div>

<table>

<thead>

<tr>

<th>Employee ID</th>

<th>Name</th>

<th>Username</th>

<th>Department</th>

<th>Role</th>

<th>Date</th>

<th>Time</th>

<th>Action</th>

</tr>

</thead>

<tbody id="history"></tbody>

</table>

<script>

let history =
JSON.parse(localStorage.getItem("LoginHistory")) || [];

let table = document.getElementById("history");

function renderHistory(){

    table.innerHTML = "";

    if(history.length === 0){

        table.innerHTML = `
        <tr>
            <td colspan="8" style="padding:30px;">
                No Login History Found
            </td>
        </tr>
        `;

        return;

    }

    history.forEach(function(log, index){

        table.innerHTML += `

        <tr>

        <td>${log.employeeID}</td>

        <td>${log.employeeName}</td>

        <td>${log.username}</td>

        <td>${log.department}</td>

        <td>${log.role}</td>

        <td>${log.date}</td>

        <td>${log.time}</td>

        <td>
            <button class="deleteBtn" title="Delete" onclick="deleteHistoryEntry(${index})">🗑</button>
        </td>

        </tr>

        `;

    });

}

function deleteHistoryEntry(index){

    if(confirm("Delete this login history entry?")){

        history.splice(index, 1);

        localStorage.setItem("LoginHistory", JSON.stringify(history));

        renderHistory();

    }

}

function clearAllHistory(){

    if(history.length === 0){
        return;
    }

    if(confirm("Delete ALL login history entries? This cannot be undone.")){

        history = [];

        localStorage.removeItem("LoginHistory");

        renderHistory();

    }

}

renderHistory();

</script>

</body>

</html>
